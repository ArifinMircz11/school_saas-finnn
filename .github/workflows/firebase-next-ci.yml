name: Firebase Next CI

on:
  push:
    branches:
      - feature/firebase-new-database
    paths:
      - "firebase-next/**"
      - ".github/workflows/firebase-next-ci.yml"
  pull_request:
    paths:
      - "firebase-next/**"
      - ".github/workflows/firebase-next-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
